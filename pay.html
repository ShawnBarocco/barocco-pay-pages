<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barocco Secure Payment</title>
<style>
  :root{--ink:#111111;--gold:#B4934C;--pale-gold:#F5F0E5;--warm-gray:#F4F4F2;}
  *{box-sizing:border-box}
  body{font-family:Helvetica,Arial,system-ui,sans-serif;margin:0;padding:0;background:var(--warm-gray);color:var(--ink)}
  .topbar{background:var(--ink);border-bottom:6px solid var(--gold);padding:18px 24px}
  .wordmark{color:var(--gold);font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
  .wrap{max-width:560px;margin:32px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #e7e2d6;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden}
  .card-head{padding:20px 24px;border-bottom:1px solid #eee}
  .card-body{padding:20px 24px}
  h1{font-size:17px;margin:0 0 4px}
  .sub{font-size:13px;color:#666;margin:0}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#888}
  .value{font-size:14px;color:var(--ink)}
  .balance{font-size:26px;font-weight:700;color:var(--ink)}
  table.lines{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
  table.lines th{text-align:left;font-size:11px;text-transform:uppercase;color:#888;padding:6px 4px;border-bottom:1px solid #eee}
  table.lines td{padding:8px 4px;border-bottom:1px solid #f2f2f2;vertical-align:top}
  .sizegrid{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:3px}
  .sizecell{border:1px solid #ddd;border-radius:4px;padding:1px 6px;font-size:11px;color:#555;font-variant-numeric:tabular-nums}
  .amt-input{font-size:20px;padding:12px;width:100%;border:1px solid #ccc;border-radius:8px;font-variant-numeric:tabular-nums}
  label{font-size:12px;color:#666;display:block;margin-bottom:6px}
  button.pay{margin-top:18px;font-size:16px;font-weight:600;padding:14px 16px;width:100%;border:0;border-radius:8px;background:var(--ink);color:#fff;cursor:pointer}
  button.pay:hover{background:#000}
  .muted{color:#888;font-size:12px;margin-top:14px;text-align:center}
  .lock{display:inline-block;margin-right:4px}
  .error-card h1{color:#b3261e}
</style>
</head>
<body>
<div class="topbar"><span class="wordmark">Barocco</span></div>
<div class="wrap">
  <div id="app" class="card"><div class="card-body"><p>Loading&hellip;</p></div></div>
</div>
<form id="redirectForm" method="post" style="display:none">
  <input type="hidden" name="token" id="redirectToken">
</form>
<script>
var FUNCTION_URL = 'https://orvurxgjmsxgtbxdzllo.supabase.co/functions/v1/pay';
var params = new URLSearchParams(location.search);
var token = params.get('t') || '';
var isDone = params.get('done') === '1' || location.hash === '#done';
var app = document.getElementById('app');

function esc(s) {
  var d = document.createElement('div');
  d.innerText = String(s);
  return d.innerHTML;
}
function money(n) {
  n = Number(n) || 0;
  return '$' + n.toFixed(2);
}
function renderError(msg) {
  app.className = 'card error-card';
  app.innerHTML = '<div class="card-body"><h1>' + esc(msg) + '</h1></div>';
}
function renderDone() {
  app.className = 'card';
  app.innerHTML = '<div class="card-body"><h1>Thank you</h1><p class="sub">Your payment was submitted. You can close this window.</p></div>';
}
function redirectTo(action, tok) {
  var f = document.getElementById('redirectForm');
  f.action = action;
  document.getElementById('redirectToken').value = tok;
  app.className = 'card';
  app.innerHTML = '<div class="card-body"><h1>Redirecting to secure payment&hellip;</h1><p class="sub">Please wait, do not close this window.</p></div>';
  f.submit();
}
function renderLineRow(line) {
  var sizes = (line.sizeGrid || []);
  var sizeHtml = '';
  if (sizes.length) {
    sizeHtml = '<div class="sizegrid">' + sizes.map(function (s) {
      return '<span class="sizecell">' + esc(s.size) + ':' + esc(s.qty) + '</span>';
    }).join('') + '</div>';
  }
  var desc = line.styleDescription || line.style || '';
  var colorDesc = line.colorDescription || line.color || '';
  return '<tr>' +
    '<td><strong>' + esc(line.style || '') + '</strong><br><span style="color:#777">' + esc(desc) + '</span></td>' +
    '<td>' + esc(colorDesc) + '</td>' +
    '<td>' + esc(line.qty || 0) + sizeHtml + '</td>' +
    '<td style="text-align:right">' + money(line.price) + '</td>' +
    '</tr>';
}
function renderAmountForm(data) {
  app.className = 'card';
  var balance = data.balance;
  var linesHtml = '';
  if (data.lines && data.lines.length) {
    linesHtml =
      '<table class="lines"><thead><tr><th>Style</th><th>Color</th><th>Qty / Sizes</th><th style="text-align:right">Price</th></tr></thead><tbody>' +
      data.lines.map(renderLineRow).join('') +
      '</tbody></table>';
  }
  var head =
    '<div class="card-head">' +
      '<h1>Invoice ' + esc(data.invoiceNumber) + '</h1>' +
      '<p class="sub">' + (data.customerName ? esc(data.customerName) : '') + '</p>' +
      '<div class="row"><span class="label">Balance due</span><span class="balance">' + money(balance) + '</span></div>' +
      (data.dueDate ? '<div class="row"><span class="label">Due date</span><span class="value">' + esc(data.dueDate) + '</span></div>' : '') +
    '</div>';
  var body =
    '<div class="card-body">' +
      linesHtml +
      '<div style="margin-top:18px">' +
        '<label>Amount to pay (USD)</label>' +
        '<input id="amountInput" class="amt-input" type="number" step="0.01" min="0.01" max="' + balance + '" value="' + balance.toFixed(2) + '"/>' +
      '</div>' +
      '<button id="continueBtn" class="pay"><span class="lock">&#128274;</span>Continue to secure payment</button>' +
      '<p class="muted">Secured by Authorize.Net. Barocco never stores your card details.</p>' +
    '</div>';
  app.innerHTML = head + body;
  document.getElementById('continueBtn').addEventListener('click', async function () {
    var amount = parseFloat(document.getElementById('amountInput').value);
    if (!amount || amount <= 0) { renderError('Enter a valid amount'); return; }
    app.innerHTML = '<div class="card-body"><p>Processing&hellip;</p></div>';
    try {
      var res = await fetch(FUNCTION_URL + '?t=' + encodeURIComponent(token), {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: amount }),
      });
      var data = await res.json();
      handleResponse(data);
    } catch (e) {
      renderError('Something went wrong. Please try again.');
    }
  });
}
function handleResponse(data) {
  if (data.error) { renderError(typeof data.error === 'string' ? data.error : 'Something went wrong'); return; }
  if (data.status === 'redirect') { redirectTo(data.action, data.token); return; }
  if (data.status === 'amount_form') { renderAmountForm(data); return; }
  if (data.status === 'done') { renderDone(); return; }
  renderError('Unexpected response');
}

(async function init() {
  if (!token) { renderError('Invalid link'); return; }
  try {
    var url = FUNCTION_URL + '?t=' + encodeURIComponent(token) + (isDone ? '&done=1' : '');
    var res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    var data = await res.json();
    handleResponse(data);
  } catch (e) {
    renderError('Something went wrong. Please try again.');
  }
})();
</script>
</body>
</html>
